<!DOCTYPE html>
<html>
<head>
    <title>Alynepro presents Dino Shootout</title>
    <style>
        body {
            background-color: #1e272e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        
        #gameContainer {
            position: relative;
            /* Responsive sizing: Maintain 4:3 aspect ratio */
            aspect-ratio: 4/3;
            width: min(90vw, 120vh); 
            max-width: 1200px; /* Cap max size on huge screens */
            
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            border: 8px solid #c0392b; /* Lava Red border */
            background-color: #000;
        }

        canvas {
            display: block;
            cursor: none; /* Hide default cursor */
            width: 100%;
            height: 100%;
        }

        /* --- UI OVERLAYS --- */
        .ui-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            pointer-events: auto;
            z-index: 10;
        }

        .hidden {
            display: none !important;
            pointer-events: none;
        }

        /* Titles & Text */
        h1 {
            color: #f1c40f;
            font-size: 60px;
            margin: 0 0 10px 0;
            text-shadow: 4px 4px 0 #000;
            font-family: 'Impact', sans-serif;
            letter-spacing: 2px;
        }

        h2 {
            color: #fff;
            font-size: 24px;
            margin: 0 0 30px 0;
            text-shadow: 2px 2px 0 #000;
            opacity: 0.9;
        }

        /* Buttons */
        .btn {
            background: linear-gradient(to bottom, #e67e22, #d35400);
            border: 4px solid #fff;
            color: white;
            padding: 15px 40px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 0 #a04000;
            transition: transform 0.1s, box-shadow 0.1s;
            text-transform: uppercase;
            margin-top: 20px;
        }

        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 5px 0 #a04000;
        }

        /* Leaderboard */
        #leaderboard {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #555;
            width: 300px;
            margin-bottom: 20px;
        }
        
        #leaderboard h3 {
            color: #2ecc71;
            margin-top: 0;
            text-transform: uppercase;
            border-bottom: 2px solid #2ecc71;
            padding-bottom: 5px;
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-family: monospace;
            font-size: 18px;
            margin: 5px 0;
        }

        /* In-Game HUD */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 5;
        }

        .hud-text {
            color: white;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 3px 3px 0 #000;
            font-family: 'Impact', sans-serif;
        }
        
        /* Small hint text for pause */
        .hud-hint {
            font-size: 16px; 
            font-weight: normal; 
            opacity: 0.7; 
            margin-top: 5px;
        }

        /* Input for High Score */
        input[type="text"] {
            font-size: 24px;
            padding: 10px;
            text-align: center;
            margin: 15px 0;
            border: 3px solid #2ecc71;
            background: #000;
            color: #fff;
            font-family: monospace;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <!-- IN GAME HUD -->
    <div id="hud" class="hidden">
        <div class="hud-text">
            SCORE: <span id="scoreDisplay">0</span>
            <div class="hud-hint">PRESS 'P' TO PAUSE</div>
        </div>
        <div class="hud-text">LIVES: <span id="livesDisplay">3</span></div>
    </div>

    <!-- MAIN MENU -->
    <div id="menuScreen" class="ui-screen">
        <h2>Alynepro presents</h2>
        <h1>DINO SHOOTOUT</h1>
        
        <div id="leaderboard">
            <h3>Top 10 Hunters</h3>
            <div id="scoresList">
                <!-- Scores injected by JS -->
                <div style="color: #aaa">No scores yet!</div>
            </div>
        </div>

        <button class="btn" onclick="startGame()">START GAME</button>
    </div>

    <!-- PAUSE SCREEN -->
    <div id="pauseScreen" class="ui-screen hidden">
        <h1>PAUSED</h1>
        <button class="btn" onclick="togglePause()">RESUME</button>
        <button class="btn" id="soundBtn" onclick="toggleSound()">SOUND: ON</button>
        <button class="btn" onclick="returnToMenu()">MAIN MENU</button>
    </div>

    <!-- GAME OVER SCREEN -->
    <div id="gameOverScreen" class="ui-screen hidden">
        <h1 style="color: #e74c3c">GAME OVER</h1>
        <h2 id="finalScoreDisplay">Final Score: 0</h2>
        
        <div id="highScoreInput" class="hidden">
            <h3 style="color: #f1c40f; margin:0;">NEW HIGH SCORE!</h3>
            <input type="text" id="playerName" placeholder="ENTER NAME" maxlength="15">
            <br>
            <button class="btn" style="font-size: 20px; padding: 10px 30px;" onclick="submitScore()">SAVE SCORE</button>
        </div>

        <button id="restartBtn" class="btn hidden" onclick="returnToMenu()">MAIN MENU</button>
    </div>
</div>

<script>
    /**
     * CONFIGURATION & ASSETS
     */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const menuScreen = document.getElementById('menuScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const pauseScreen = document.getElementById('pauseScreen');
    const hud = document.getElementById('hud');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const livesDisplay = document.getElementById('livesDisplay');
    const scoresList = document.getElementById('scoresList');
    const highScoreInputDiv = document.getElementById('highScoreInput');
    const playerNameInput = document.getElementById('playerName');
    const restartBtn = document.getElementById('restartBtn');
    const soundBtn = document.getElementById('soundBtn');

    // Images
    const dinoImg = new Image();
    dinoImg.src = 'dinosaur.png';
    const bgImg = new Image();
    bgImg.src = 'volcano_bg.png';

    // Game State
    let gameState = 'MENU'; // MENU, PLAYING, PAUSED, GAMEOVER
    let isPaused = false;
    let soundEnabled = true;
    let score = 0;
    let lives = 3;
    let targets = [];
    let particles = [];
    let mouseX = 400;
    let mouseY = 300;
    
    // Timing logic
    let spawnRate = 1000;
    let spawnTimer = 0;
    let lastTime = 0;

    // Leaderboard Data
    let highScores = JSON.parse(localStorage.getItem('dinoShooterScores')) || [];

    /**
     * AUDIO SYSTEM
     */
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    function playSound(type) {
        if (!soundEnabled) return; // Mute check
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'shoot') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
            gainNode.gain.setValueAtTime(0.05, now);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'hit') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.2);
            gainNode.gain.setValueAtTime(0.1, now);
            gainNode.gain.linearRampToValueAtTime(0, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'over') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.linearRampToValueAtTime(50, now + 1);
            gainNode.gain.setValueAtTime(0.2, now);
            gainNode.gain.linearRampToValueAtTime(0, now + 1);
            osc.start(now);
            osc.stop(now + 1);
        }
    }

    /**
     * MENU & PAUSE FUNCTIONS
     */
    function togglePause() {
        if (gameState !== 'PLAYING' && gameState !== 'PAUSED') return;
        
        isPaused = !isPaused;
        
        if (isPaused) {
            gameState = 'PAUSED';
            pauseScreen.classList.remove('hidden');
            hud.classList.add('hidden');
        } else {
            gameState = 'PLAYING';
            pauseScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            // Reset lastTime so delta doesn't jump
            lastTime = performance.now();
        }
    }

    function toggleSound() {
        soundEnabled = !soundEnabled;
        soundBtn.innerText = `SOUND: ${soundEnabled ? 'ON' : 'OFF'}`;
    }

    // Input for Pause
    window.addEventListener('keydown', (e) => {
        if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
            togglePause();
        }
    });

    /**
     * LEADERBOARD FUNCTIONS
     */
    function updateLeaderboardUI() {
        scoresList.innerHTML = '';
        if (highScores.length === 0) {
            scoresList.innerHTML = '<div style="color: #aaa">No scores yet!</div>';
            return;
        }
        
        highScores.sort((a, b) => b.score - a.score);
        highScores = highScores.slice(0, 10);
        
        highScores.forEach((entry, index) => {
            const row = document.createElement('div');
            row.className = 'score-row';
            row.innerHTML = `<span>${index + 1}. ${entry.name}</span> <span>${entry.score}</span>`;
            scoresList.appendChild(row);
        });
        
        localStorage.setItem('dinoShooterScores', JSON.stringify(highScores));
    }

    function checkHighScore(finalScore) {
        if (finalScore > 0) {
            if (highScores.length < 10 || finalScore > highScores[highScores.length - 1].score) {
                return true;
            }
        }
        return false;
    }

    function submitScore() {
        const name = playerNameInput.value.trim() || "ANONYMOUS";
        highScores.push({ name: name, score: score });
        updateLeaderboardUI();
        returnToMenu();
    }

    /**
     * GAME LOGIC
     */
    function startGame() {
        score = 0;
        lives = 3;
        targets = [];
        particles = [];
        spawnRate = 1000;
        spawnTimer = 0;
        isPaused = false;
        
        scoreDisplay.innerText = score;
        livesDisplay.innerText = lives;
        
        gameState = 'PLAYING';
        
        menuScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        pauseScreen.classList.add('hidden');
        hud.classList.remove('hidden');
        
        if (audioCtx.state === 'suspended') audioCtx.resume();
        lastTime = performance.now();
    }

    function gameOver() {
        gameState = 'GAMEOVER';
        playSound('over');
        
        hud.classList.add('hidden');
        gameOverScreen.classList.remove('hidden');
        
        document.getElementById('finalScoreDisplay').innerText = `Final Score: ${score}`;
        
        if (checkHighScore(score)) {
            highScoreInputDiv.classList.remove('hidden');
            restartBtn.classList.add('hidden');
            playerNameInput.value = '';
            playerNameInput.focus();
        } else {
            highScoreInputDiv.classList.add('hidden');
            restartBtn.classList.remove('hidden');
        }
    }

    function returnToMenu() {
        updateLeaderboardUI();
        gameState = 'MENU';
        isPaused = false;
        gameOverScreen.classList.add('hidden');
        pauseScreen.classList.add('hidden');
        menuScreen.classList.remove('hidden');
    }

    updateLeaderboardUI();

    /**
     * CLASSES
     */
    class Target {
        constructor() {
            this.width = 70;
            this.height = 70;
            this.x = Math.random() * (canvas.width - this.width);
            this.y = canvas.height + 10;
            
            const difficultyMultiplier = 1 + (score / 200);
            this.speedY = (Math.random() * 2 + 1.5) * difficultyMultiplier;
            this.speedX = (Math.random() - 0.5) * 3;
        }

        update() {
            this.y -= this.speedY;
            this.x += this.speedX;
            if (this.x < 0 || this.x > canvas.width - this.width) this.speedX *= -1;
        }

        draw() {
            if (dinoImg.complete && dinoImg.naturalHeight !== 0) {
                ctx.drawImage(dinoImg, this.x, this.y, this.width, this.height);
            } else {
                ctx.fillStyle = '#ff9f43'; 
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.fillStyle = 'black';
                ctx.fillRect(this.x + 10, this.y + 10, 10, 10);
                ctx.fillRect(this.x + 40, this.y + 10, 10, 10);
            }
        }

        isHit(mx, my) {
            return (mx >= this.x && mx <= this.x + this.width &&
                    my >= this.y && my <= this.y + this.height);
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y;
            this.size = Math.random() * 6 + 2;
            this.speedX = Math.random() * 8 - 4;
            this.speedY = Math.random() * 8 - 4;
            this.color = color;
            this.life = 1.0;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= 0.04;
        }
        draw() {
            ctx.fillStyle = this.color;
            ctx.globalAlpha = this.life;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1.0;
        }
    }

    /**
     * INPUTS
     */
    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
        mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
    });

    canvas.addEventListener('mousedown', (e) => {
        if (gameState !== 'PLAYING') return;

        playSound('shoot');
        let hit = false;
        
        for (let i = targets.length - 1; i >= 0; i--) {
            if (targets[i].isHit(mouseX, mouseY)) {
                for(let p=0; p<12; p++) particles.push(new Particle(targets[i].x + 35, targets[i].y + 35, '#f39c12'));
                
                targets.splice(i, 1);
                score += 10;
                scoreDisplay.innerText = score;
                hit = true;
                playSound('hit');
                break;
            }
        }
    });

    /**
     * MAIN LOOP
     */
    function loop(timestamp) {
        // Calculate Delta Time
        const deltaTime = timestamp - lastTime;
        lastTime = timestamp;

        // 1. Draw Background
        if (bgImg.complete && bgImg.naturalHeight !== 0) {
            ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
        } else {
            // Fallback Volcano Bg
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#2c3e50'); 
            gradient.addColorStop(1, '#e74c3c'); 
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#2d3436';
            ctx.beginPath(); ctx.moveTo(150, canvas.height - 80); ctx.lineTo(350, 250); ctx.lineTo(550, canvas.height - 80); ctx.fill();
            ctx.beginPath(); ctx.moveTo(350, canvas.height - 80); ctx.lineTo(600, 150); ctx.lineTo(850, canvas.height - 80); ctx.fill();
            ctx.fillStyle = '#e67e22';
            ctx.beginPath(); ctx.moveTo(600, 150); ctx.lineTo(580, 250); ctx.lineTo(600, 180); ctx.lineTo(620, 250); ctx.fill();
            ctx.fillStyle = '#3e2723'; 
            ctx.fillRect(0, canvas.height - 80, canvas.width, 80);
        }

        // 2. Logic based on state
        if (gameState === 'PLAYING') {
            
            // Add to timer using deltaTime
            spawnTimer += deltaTime;

            // Spawning
            if (spawnTimer > spawnRate) {
                targets.push(new Target());
                spawnRate = Math.max(500, 1000 - (score));
                spawnTimer = 0;
            }

            // Targets Update
            for (let i = targets.length - 1; i >= 0; i--) {
                targets[i].update();
                if (targets[i].y < -80) {
                    targets.splice(i, 1);
                    lives--;
                    livesDisplay.innerText = lives;
                    if (lives <= 0) gameOver();
                }
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
        }

        // 3. Draw Game Objects (Draw them even if paused!)
        // Particles
        particles.forEach(p => p.draw());
        // Targets
        targets.forEach(t => t.draw());

        // 4. Crosshair
        // Draw crosshair if Playing OR Paused (so you see where you are)
        if (gameState === 'PLAYING' || gameState === 'PAUSED') {
            ctx.strokeStyle = '#fff'; 
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(mouseX, mouseY, 20, 0, Math.PI * 2);
            ctx.moveTo(mouseX - 25, mouseY); ctx.lineTo(mouseX + 25, mouseY);
            ctx.moveTo(mouseX, mouseY - 25); ctx.lineTo(mouseX, mouseY + 25);
            ctx.stroke();
        }

        requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);

</script>
</body>
</html>
